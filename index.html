<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗词格律 · 古代汉语学习路径</title>
<!-- 样式表 -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header id="topbar">
  <!-- 品牌题签：线装书签样式 + 朱砂小印章 -->
  <div class="brand">
    <span class="brand-mark">诗词格律</span>
    <span class="brand-sub">古代汉语 · 可交互学习路径</span>
    <span class="brand-stamp" title="学习路径">学</span>
  </div>

  <!-- 页签 -->
  <nav class="tabs">
    <button class="tab active" data-tab="path">学习路径</button>
    <button class="tab" data-tab="quickref">速查表</button>
  </nav>

  <!-- 全局进度 -->
  <div class="global-progress">
    <div class="gp-text">已完成 <b id="gp-count">0</b>/20</div>
    <div class="gp-cells" id="gp-cells"></div>
  </div>

  <!-- 重置进度 -->
  <button class="btn secondary reset-btn" id="btn-reset" title="清空学习进度，从头开始">重置进度</button>
</header>

<!-- ============ 主布局 ============ -->
<div class="layout" id="path-view">
  <!-- 侧栏：三板块节点导航 -->
  <aside id="sidebar"></aside>

  <!-- 内容区 -->
  <main id="content">
    <!-- 平仄标注模式开关（内容区角落） -->
    <div class="mode-toggle">
      <span class="mode-label">平仄标注</span>
      <button id="tone-mode" class="toggle-btn" title="切换「汉字」与「符号」两种平仄标注显示">平/仄</button>
    </div>
    <div id="content-inner"></div>
  </main>
</div>

<!-- ============ 速查表页签 ============ -->
<div id="quickref-view" class="hidden"></div>

<!-- ============ 浮层与提示 ============ -->
<!-- 点字平仄浮层 -->
<div id="tooltip" class="tooltip hidden"></div>
<!-- 轻提示 -->
<div id="toast" class="toast hidden"></div>
<!-- 确认弹窗（锁定节点跳过 / 未完成标记） -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-msg"></div>
    <div class="modal-btns">
      <button class="btn secondary modal-cancel">取消</button>
      <button class="btn primary modal-ok">仍要进入</button>
    </div>
  </div>
</div>

<!-- ============ 数据与脚本 ============ -->
<script src="data/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
